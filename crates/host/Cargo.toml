[package]
name = "cosmos-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Axum application host: assembles services, middleware, and serves the Explorer SPA."

[dependencies]
cosmos-core.workspace = true
cosmos-storage.workspace = true
cosmos-auth.workspace = true
cosmos-query.workspace = true
cosmos-kql.workspace = true
cosmos-nosql.workspace = true
cosmos-mongodb.workspace = true
cosmos-triggers.workspace = true
cosmos-explorer = { workspace = true, optional = true }
async-trait.workspace = true
axum.workspace = true
axum-server.workspace = true
rustls.workspace = true
tower.workspace = true
tower-http.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
rcgen.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["explorer"]
# Embed the Explorer SPA (via the cosmos-explorer crate) and serve it at
# `/explorer`. Disable (`--no-default-features`) to build a slim binary; the
# `--explorer-dir` runtime override still works without this feature.
explorer = ["dep:cosmos-explorer"]

[dev-dependencies]
tokio.workspace = true
tower = { workspace = true, features = ["util"] }
