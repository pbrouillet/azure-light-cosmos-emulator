[package]
name = "cosmos-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "cosmos-emulator command-line interface (ports the .NET Cli project)."

[[bin]]
name = "cosmos-emulator"
path = "src/main.rs"

[dependencies]
cosmos-core.workspace = true
cosmos-host = { path = "../host", default-features = false }
cosmos-auth.workspace = true
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[features]
default = ["explorer"]
# Embed the Explorer SPA into the emulator binary (default). Build with
# `--no-default-features` to produce a slim binary without the Explorer.
explorer = ["cosmos-host/explorer"]
