name: CI

# Continuous integration for the Rust/Axum Cosmos DB light emulator. Runs when
# the Cargo workspace, the Explorer SPA, or this workflow changes.

on:
  push:
    branches:
      - main
      - rust-port
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'perf/**'
      - 'docker/**'
      - 'packaging/**'
      - 'explorer/**'
      - 'crates/explorer/wwwroot/explorer/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'perf/**'
      - 'docker/**'
      - 'packaging/**'
      - 'explorer/**'
      - 'crates/explorer/wwwroot/explorer/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (slim / no Explorer)
        run: cargo clippy -p cosmos-cli --no-default-features -- -D warnings

      - name: Test
        run: cargo test --workspace

  binaries:
    name: release binaries (with-explorer + slim)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (with Explorer)
        run: cargo build --release -p cosmos-cli

      - name: Stage with-Explorer binary
        run: |
          mkdir -p dist
          cp target/release/cosmos-emulator dist/cosmos-emulator-with-explorer

      - name: Build (slim, no Explorer)
        run: cargo build --release -p cosmos-cli --no-default-features

      - name: Stage slim binary
        run: cp target/release/cosmos-emulator dist/cosmos-emulator-slim

      - name: Report binary sizes
        run: ls -lh dist/

      - name: Upload with-Explorer binary
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-emulator-with-explorer
          path: dist/cosmos-emulator-with-explorer
          if-no-files-found: error

      - name: Upload slim binary
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-emulator-slim
          path: dist/cosmos-emulator-slim
          if-no-files-found: error

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile .

  explorer-spa:
    name: explorer SPA build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: explorer/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: explorer

      - name: Build (tsc -b && vite build)
        run: npm run build
        working-directory: explorer

      # The built assets under crates/explorer/wwwroot/explorer/ are committed and
      # embedded into the release binary at compile time (rust-embed). The
      # committed copy is authoritative; this step surfaces (but does not gate
      # on) drift, since Rollup content hashes can differ across toolchains.
      - name: Report committed asset drift (informational)
        continue-on-error: true
        run: |
          if ! git diff --quiet -- crates/explorer/wwwroot/explorer; then
            echo "::warning::Committed Explorer assets differ from a fresh build. Run 'cd explorer && npm run build' and commit the result."
            git --no-pager diff --stat -- crates/explorer/wwwroot/explorer
          else
            echo "Committed Explorer assets are up to date."
          fi

  sdk-e2e:
    name: real-SDK / driver E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-
            ${{ runner.os }}-cargo-

      - name: Build release CLI
        run: cargo build --release -p cosmos-cli

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run parity E2E (http + tls, node + python + mongo)
        run: crates/parity/sdk/run_parity.sh --start --tls
        env:
          PARITY_WORKDIR: ${{ runner.temp }}/parity

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-e2e-logs
          path: ${{ runner.temp }}/parity/server-*.log
          if-no-files-found: ignore
