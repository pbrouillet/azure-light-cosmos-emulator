name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore
        run: dotnet restore Azure.Cosmos.LightEmulator.slnx
      - name: Build
        run: dotnet build Azure.Cosmos.LightEmulator.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Azure.Cosmos.LightEmulator.slnx -c Release --no-build --verbosity normal -p:SkipCloneSdkTests=true

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile .

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, win-x64, win-arm64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - name: Publish ${{ matrix.rid }}
        run: >-
          dotnet publish src/Cli/Azure.Cosmos.LightEmulator.Cli.csproj
          -c Release -r ${{ matrix.rid }} --self-contained
          -o publish/${{ matrix.rid }}
      - name: Package ${{ matrix.rid }}
        id: package
        run: |
          set -e
          name="azure-cosmos-light-emulator-${{ steps.version.outputs.VERSION }}-${{ matrix.rid }}"
          cd publish/${{ matrix.rid }}
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            zip -r "../../${name}.zip" .
            echo "asset=${name}.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "../../${name}.tar.gz" .
            echo "asset=${name}.tar.gz" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.asset }}

  docker-release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}:latest
