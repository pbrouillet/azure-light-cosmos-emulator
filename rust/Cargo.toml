[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/storage",
    "crates/auth",
    "crates/query",
    "crates/kql",
    "crates/nosql",
    "crates/mongodb",
    "crates/triggers",
    "crates/host",
    "crates/cli",
    "crates/parity",
]

# Shared dependency versions. Individual crates opt in via `workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
repository = "https://github.com/pbrouillet/azure-light-cosmos-emulator"

[workspace.dependencies]
# Async runtime & HTTP
tokio = { version = "1", features = ["full"] }
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
hyper = "1"

# Embedded static assets (Explorer SPA embedded into the host binary)
rust-embed = "8"
mime_guess = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors & logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rcgen = "0.13"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Auth
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

# Internal crates
cosmos-core = { path = "crates/core" }
cosmos-storage = { path = "crates/storage" }
cosmos-auth = { path = "crates/auth" }
cosmos-query = { path = "crates/query" }
cosmos-kql = { path = "crates/kql" }
cosmos-nosql = { path = "crates/nosql" }
cosmos-mongodb = { path = "crates/mongodb" }
cosmos-triggers = { path = "crates/triggers" }
cosmos-host = { path = "crates/host" }
cosmos-cli = { path = "crates/cli" }

# HTTP client (black-box parity harness)
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
